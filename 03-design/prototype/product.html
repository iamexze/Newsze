<title>Newze Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   NEWZE TERMINAL — layout: fixed rail + ticker strip, scrolling work area.
   Dark-first (traders work in dark at 07:30 and 23:00); light fully designed.
   Tokens are the project's own, 03-design/design-system.md.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* dark is the base palette — the skeleton pins color-scheme:light, so we set it */
  --bg:#080B11; --surface:#0E131C; --raised:#141A25; --sunken:#05070B;
  --border:#1E2634; --border-bright:#2C3747;
  --fg:#E8ECF4; --muted:#8793A7; --faint:#58637A;
  --accent:#4D8DFF; --accent-dim:#1E3A6B; --accent-glow:rgba(77,141,255,.14);
  --up:#2FBF71; --up-dim:#123524; --down:#FF5A5A; --down-dim:#3A1414;
  --flat:#8793A7; --warn:#F0A830; --warn-dim:#2E2206; --rumour:#A982FF;
  --grid:rgba(255,255,255,.04);
  --display:'Inter Tight',system-ui,sans-serif;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:7px; --rail:62px; --strip:34px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#FBFCFD; --surface:#FFFFFF; --raised:#F5F7FA; --sunken:#EDF0F5;
  --border:#E1E6EE; --border-bright:#CBD3E0;
  --fg:#0C1119; --muted:#5A6678; --faint:#8E99AC;
  --accent:#1D5BD6; --accent-dim:#D7E3FB; --accent-glow:rgba(29,91,214,.08);
  --up:#0B7A45; --up-dim:#DCF2E7; --down:#C42B2B; --down-dim:#FBE4E4;
  --flat:#6B7688; --warn:#9A5B06; --warn-dim:#FCF1DF; --rumour:#6B32C9;
  --grid:rgba(0,0,0,.035);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#FBFCFD; --surface:#FFFFFF; --raised:#F5F7FA; --sunken:#EDF0F5;
  --border:#E1E6EE; --border-bright:#CBD3E0;
  --fg:#0C1119; --muted:#5A6678; --faint:#8E99AC;
  --accent:#1D5BD6; --accent-dim:#D7E3FB; --accent-glow:rgba(29,91,214,.08);
  --up:#0B7A45; --up-dim:#DCF2E7; --down:#C42B2B; --down-dim:#FBE4E4;
  --flat:#6B7688; --warn:#9A5B06; --warn-dim:#FCF1DF; --rumour:#6B32C9;
  --grid:rgba(0,0,0,.035);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:60;background:var(--bg)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.warnc{color:var(--warn)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── shell ───────────────────────────────────────────────────────────── */
#app{display:grid;height:100%;
  grid-template-columns:var(--rail) 1fr;
  grid-template-rows:var(--strip) 1fr;
  grid-template-areas:"rail strip" "rail main";
  padding-top:env(safe-area-inset-top,0px)}

/* rail */
#rail{grid-area:rail;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);overflow:hidden}
.mark{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:-.04em;
  color:var(--accent);margin-bottom:12px;line-height:1}
.mark b{display:block;font-size:8px;font-weight:600;letter-spacing:.14em;
  color:var(--faint);margin-top:3px}
.navbtn{width:46px;height:44px;border-radius:var(--r);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--muted);
  transition:background .12s,color .12s;position:relative}
.navbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.navbtn span{font-size:8.5px;font-weight:600;letter-spacing:.03em}
.navbtn:hover{background:var(--raised);color:var(--fg)}
.navbtn[aria-current="page"]{color:var(--accent);background:var(--accent-glow)}
.navbtn[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:12px;
  bottom:12px;width:2px;background:var(--accent);border-radius:2px}
.railsp{flex:1}

/* ticker strip */
#strip{grid-area:strip;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0;overflow-x:auto;overflow-y:hidden;
  padding-right:max(8px,env(safe-area-inset-right,0px));scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.tick{display:flex;align-items:baseline;gap:6px;padding:0 11px;height:100%;
  border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0;
  font-size:11.5px;transition:background .3s}
.tick.flash-up{background:var(--up-dim)} .tick.flash-dn{background:var(--down-dim)}
.tick b{font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.04em}
.tick .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.tick .c{font-family:var(--mono);font-size:10.5px}
.striptools{margin-left:auto;display:flex;align-items:center;gap:4px;padding:0 6px;
  flex-shrink:0;position:sticky;right:0;background:var(--surface)}
.iconbtn{width:27px;height:27px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted)}
.iconbtn:hover{background:var(--raised);color:var(--fg)}
.iconbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--border-bright);
  border-radius:3px;padding:1px 4px;color:var(--faint)}

/* main */
#main{grid-area:main;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.page{padding:16px max(16px,env(safe-area-inset-right,0px))
  calc(64px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:1560px;margin:0 auto}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:14px}
.phead h1{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.02em;
  text-wrap:balance}
.phead p{font-size:12px;color:var(--muted);margin-top:2px}
.eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent)}

/* grid + cards */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:13px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card h2{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card h2 .tag{margin-left:auto;font-size:9px;letter-spacing:.04em;color:var(--faint);
  font-weight:500;text-transform:none}
.sub{font-size:11px;color:var(--faint)}
hr{border:0;border-top:1px solid var(--border);margin:10px 0}

/* chips + badges */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
  padding:2px 7px;border-radius:999px;border:1px solid var(--border-bright);
  color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.chip.up{background:var(--up-dim);border-color:transparent;color:var(--up)}
.chip.dn{background:var(--down-dim);border-color:transparent;color:var(--down)}
.chip.w{background:var(--warn-dim);border-color:transparent;color:var(--warn)}
.chip.a{background:var(--accent-glow);border-color:transparent;color:var(--accent)}
.chip.r{background:transparent;border-color:var(--rumour);color:var(--rumour)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.t0{background:var(--accent)} .t1{background:var(--muted)}
.t2{background:transparent;border:1.4px solid var(--muted)}
.t3{background:transparent;border:1.4px solid var(--faint)}
.t4{background:var(--rumour)}
.stale{font-family:var(--mono);font-size:9px;color:var(--faint);
  border:1px solid var(--border);border-radius:3px;padding:0 4px}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);text-align:right;padding:0 8px 7px;white-space:nowrap}
th:first-child{text-align:left;padding-left:0} th:last-child{padding-right:0}
td{padding:7px 8px;border-top:1px solid var(--border);text-align:right;font-size:12px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{text-align:left;font-family:var(--ui);font-weight:500;padding-left:0}
td:last-child{padding-right:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--raised)}
.clickrow{cursor:pointer}
.scrollx{overflow-x:auto}

/* impact card */
.ic{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
  overflow:hidden;transition:border-color .15s}
.ic:hover{border-color:var(--border-bright)}
.ic header{padding:11px 13px 10px;border-bottom:1px solid var(--border)}
.icmeta{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--faint);
  font-family:var(--mono);flex-wrap:wrap}
.ic h3{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.28;
  margin-top:6px;letter-spacing:-.01em;text-wrap:balance}
.icbody{padding:11px 13px}
.icfoot{padding:8px 13px;border-top:1px solid var(--border);background:var(--sunken);
  font-size:10px;color:var(--faint);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nohist{font-size:11.5px;color:var(--warn);font-style:italic;padding:7px 0}

/* settlement clock — the signature element */
.settle{display:flex;align-items:center;gap:7px;font-size:10px;font-family:var(--mono);
  color:var(--faint)}
.sring{width:15px;height:15px;flex-shrink:0}
.sring circle{fill:none;stroke-width:2.4;transform:rotate(-90deg);transform-origin:50% 50%}
.sring .bgc{stroke:var(--border-bright)} .sring .fgc{stroke:var(--accent);
  transition:stroke-dashoffset .6s linear}
.settled-hit{color:var(--up)} .settled-miss{color:var(--down)}

/* bars */
.bar{position:relative;height:5px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;
  transition:width .5s cubic-bezier(.22,.8,.3,1)}
.wf{display:grid;gap:4px}
.wfrow{display:grid;grid-template-columns:minmax(72px,98px) 1fr 50px;align-items:center;
  gap:8px;font-size:11.5px}
.wfn{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wfb{position:relative;height:14px;background:var(--sunken);border-radius:3px}
.wfb::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;
  background:var(--border-bright)}
.wfb i{position:absolute;top:0;height:100%;border-radius:2px;
  animation:grow .55s cubic-bezier(.22,.8,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wfv{text-align:right;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}

/* wire */
.wire{display:flex;flex-direction:column}
.wi{padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .12s;display:grid;grid-template-columns:1fr auto;gap:10px;
  align-items:start}
.wi:hover{background:var(--raised)}
.wi.fresh{animation:slidein .45s cubic-bezier(.22,.8,.3,1) both}
@keyframes slidein{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.wi h4{font-size:13.5px;font-weight:600;line-height:1.32;margin:4px 0 5px;
  letter-spacing:-.005em}
.impactbar{width:46px;height:3px;background:var(--sunken);border-radius:2px;
  overflow:hidden;margin-top:5px}
.impactbar i{display:block;height:100%;border-radius:2px}

/* big number */
.hero{position:relative;text-align:center;padding:16px 0 8px}
.hero::before{content:"";position:absolute;left:50%;top:40%;width:260px;height:160px;
  transform:translate(-50%,-50%);background:radial-gradient(ellipse,var(--accent-glow),transparent 70%);
  pointer-events:none}
.hero .sym{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);position:relative}
.hero .big{font-family:var(--display);font-size:clamp(42px,8vw,64px);font-weight:600;
  line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.035em;margin:4px 0 2px;
  position:relative}
.hero .dl{font-family:var(--mono);font-size:15px;font-weight:500;position:relative}

/* ledger */
.calib{width:100%;height:auto;display:block}
.statbig{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.statlbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-top:5px}

/* palette */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.52);backdrop-filter:blur(2px);
  z-index:70;display:grid;place-items:start center;padding-top:12vh}
#scrim[hidden]{display:none}
#pal{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border-bright);
  border-radius:11px;box-shadow:0 22px 64px rgba(0,0,0,.45);overflow:hidden}
#palin{width:100%;padding:14px 16px;background:none;border:0;color:var(--fg);
  font:inherit;font-size:15px;border-bottom:1px solid var(--border)}
#palin::placeholder{color:var(--faint)}
#pallist{max-height:46vh;overflow-y:auto;padding:5px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:6px;
  cursor:pointer;font-size:13px}
.pitem.sel{background:var(--accent-glow);color:var(--accent)}
.pitem .pk{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.pitem .pc{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);min-width:52px}

/* toasts */
#toasts{position:fixed;right:max(14px,env(safe-area-inset-right,0px));
  bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;
  flex-direction:column;gap:8px;width:min(320px,calc(100vw - 28px))}
.toast{background:var(--raised);border:1px solid var(--border-bright);border-left:2px solid var(--accent);
  border-radius:var(--r);padding:10px 12px;font-size:12px;cursor:pointer;
  animation:pop .35s cubic-bezier(.22,.8,.3,1) both;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@keyframes pop{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast b{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin-bottom:3px}

/* banner */
.proto{background:var(--warn-dim);border:1px solid var(--warn);border-radius:var(--r);
  padding:8px 11px;font-size:11.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.proto b{color:var(--warn)}

/* responsive */
@media (max-width:860px){
  :root{--rail:54px}
  .navbtn span{display:none}
  .navbtn{height:40px}
}
@media (max-width:620px){
  #app{grid-template-columns:1fr;grid-template-rows:var(--strip) 1fr auto;
    grid-template-areas:"strip" "main" "rail"}
  #rail{flex-direction:row;border-right:0;border-top:1px solid var(--border);
    justify-content:space-around;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px));
    gap:0;overflow-x:auto}
  .mark{display:none} .railsp{display:none}
  .navbtn span{display:block}
  .navbtn[aria-current="page"]::before{left:14px;right:14px;top:-4px;bottom:auto;
    width:auto;height:2px}
  .page{padding-bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;
  transition-duration:.01ms!important}}
</style>
